name: Build mod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Giải nén dự án từ file zip trong repo
        run: |
          mkdir -p _proj
          for z in *.zip; do unzip -q -o "$z" -d _proj; done
          DIR=$(dirname "$(find _proj -name build.gradle | head -n 1)")
          echo "Thư mục dự án: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          gradle build --stacktrace

      - name: Upload file .jar
        uses: actions/upload-artifact@v4
        with:
          name: kimetsu-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
